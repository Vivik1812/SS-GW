server:
  port: ${SERVER_PORT:9000}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
          routes:
            #Usuarios
            - id: usuarios-service
              uri: ${USUARIOS_SERVICE_URL:http://usuarios-service:8080}
              predicates:
                - Path=/api/v1/usuarios/**

            #OAuh2
            - id: usuarios-oauth2
              uri: ${USUARIOS_SERVICE_URL:http://usuario-service:8080}
              predicates:
                - Path=/oauth2/**,/login/**

            - id: usuarios-oauth2-callback
              uri: ${USUARIOS_SERVICE_URL:http://usuarios-service:8080}
              predicates:
                - Path=/login/oauth2/code/google